# 1 GB heap: enough for this app (no Compose/Media3) and safe on a ~2 GB RAM machine with swap.
# 256 MB was too small and crashed the Gradle daemon (see old build-log-release-256m.txt).
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.daemon.enabled=false
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
